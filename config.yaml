# =============================================================================
# Kira — non-secret configuration
# API keys belong in .env, never here.
# =============================================================================

# Settings builds its key/model fields from this list. key_test_path
# (default "/models") is what the Test button requests with the key.
providers:
  - name: groq
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: GROQ_API_KEY
    model: "qwen/qwen3.8-27b"

  - name: openrouter
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: OPENROUTER_API_KEY
    model: "poolside/laguna-s-2.1:free"
    # /models is public on OpenRouter, so the Settings "Test" button uses /key
    key_test_path: "/key"

  - name: ollama
    base_url: "http://localhost:11434/v1"
    api_key_env: null          # Ollama runs locally — no key needed
    model: "qwen2.5:7b"

# ---------------------------------------------------------------------------
# Cooldown durations (seconds)
# ---------------------------------------------------------------------------
cooldowns:
  rate_limit:   900    # 15 min — HTTP 429 (transient rate limit)
  timeout:       60    # 1 min  — network timeout or connection error
  server_error:  60    # 1 min  — HTTP 5xx
  quota:       3600    # 1 hr   — quota / daily-limit exhaustion (adjust freely)

# Rolling conversation memory: total user+assistant messages kept
memory_limit: 20

# =============================================================================
# Persona
# Change name to "ryuk" and swap system_prompt for the sarcastic persona.
# Both personas share the same safety rules.
# =============================================================================
persona:
  name: kira
  # Selectable personas: "kira" (calm & strategic) or "ryuk" (bored & sarcastic)
  # Both personas share the exact same safety rules and confirmation wording.
  available_personas:
    kira:
      name: kira
      greeting: "Greetings. Let us work strategically and methodically."
      # Avatar character profile (M8). renderer: sprite | vrm. A relative
      # asset path is resolved from the project folder (models/ is git-ignored).
      # If the .vrm file is missing, the 2D sprite is used with a notice.
      character:
        display_name: "Kira"
        renderer: vrm
        asset: "models/kira.vrm"
        framing: bust             # bust | full
        theme: notebook           # notebook (black and red) | gotham
        voice: "en-US-GuyNeural"
      system_prompt: |
        You are Kira, a calm and strategic AI mentor for software developers.
        You think carefully before answering, explain your reasoning step by step,
        and guide the user with precision and clarity. When performing tasks on
        the user's computer you narrate each action before taking it.
        You never rush. You prioritise correctness and safety above speed.
        When you do not know something you say so and suggest how to find out.

    ryuk:
      name: ryuk
      greeting: "Hey... Got an apple? Fine, let's see what you broke today."
      character:
        display_name: "Ryuk"
        renderer: sprite
        asset: null
        framing: bust
        theme: gotham
        voice: "en-US-ChristopherNeural"
      # Spoken when something fails (tone only; the facts stay honest)
      error_lines:
        crash: "Well, that broke. I stopped right there, nothing else ran. Try again, human."
        offline: "No brain on the line. Internet's gone, and Ollama isn't running either. I'll just eat an apple."
      system_prompt: |
        You are Ryuk, a bored, sarcastic, and playful desktop companion for a developer.
        You drop occasional dry apple jokes and tease the human, but you ALWAYS perform
        the requested task accurately and carefully. You speak in short, punchy sentences.
        You never waste words. You respect all safety boundaries completely.

  system_prompt: |
    You are Kira, a calm and strategic AI mentor for software developers.
    You think carefully before answering, explain your reasoning step by step,
    and guide the user with precision and clarity. When performing tasks on
    the user's computer you narrate each action before taking it.
    You never rush. You prioritise correctness and safety above speed.
    When you do not know something you say so and suggest how to find out.

# =============================================================================
# Permission mode settings
# =============================================================================
mode:
  # Seconds before Free mode auto-reverts to Restricted (default 10 minutes)
  free_revert_timeout: 600
  # The Free-mode PIN is a secret: set KIRA_FREE_MODE_PIN in .env (or in
  # Settings). Without it, Free mode stays disabled.
  # Wrong-PIN lockout: after this many wrong attempts, refuse for N seconds
  pin_max_attempts: 3
  pin_lockout_seconds: 60

# =============================================================================
# Tool allow-lists
# =============================================================================
tools:
  allowed_commands:
    - "python"
    - "py"
    - "pytest"
    - "dir"
    - "echo"
    - "type"
  allowed_apps:
    - "code"
    - "notepad"
    - "calc"
    - "cmd"
    - "explorer"
  allowed_websites:
    - "github.com"
    - "google.com"
    - "python.org"
    - "stackoverflow.com"
  # Seconds to wait for the VS Code window title to appear after launch
  vscode_window_timeout: 15
  # Seconds between individual keystrokes when typing code visibly
  type_interval: 0.04
  # Seconds the visible CMD window remains open after command execution (default: 20s)
  cmd_pause_seconds: 20
  # M2 system tools
  volume_step: 10            # percent per "volume up/down"
  brightness_step: 10        # percent per "brightness up/down"
  screenshots_dir: "screenshots"   # inside workspace/ (git-ignored)

# =============================================================================
# WhatsApp settings (Milestone 3)
# =============================================================================
whatsapp:
  rate_limit_per_hour: 5
  daily_cap: 20
  min_gap_seconds: 30
  max_message_length: 280

# =============================================================================
# Voice settings (Step 4)
# =============================================================================
voice:
  # Push-to-talk hotkey (hold to record, release to transcribe)
  # Configurable: use a character key (e.g. "`") or a function key
  hotkey: "`"
  # Global emergency kill hotkey (halts all speech, agent loops and tools instantly)
  kill_hotkey: "ctrl+alt+k"
  # M9: speak the persona's greeting when Kira starts
  startup_greeting: true
  # Microphone: null = system default, or a device name / index (see Settings)
  input_device: null

  # Speech-to-Text (STT)
  stt:
    # NOTE: "whisper-large-v3-turbo" is a placeholder model name to be verified by user
    groq_model: "whisper-large-v3-turbo"
    # Local fallback model when Groq fails or is on cooldown
    local_model: "small"
    # Minimum audio duration (seconds) — taps under this are ignored
    min_duration: 0.3
    # Maximum recording duration (seconds)
    max_duration: 30.0
    # Confidence thresholds
    min_avg_logprob: -1.0
    max_no_speech_prob: 0.6
    timeouts:
      groq: 10
      local: 30

  # Text-to-Speech (TTS)
  tts:
    # NOTE: "en-US-GuyNeural" is a placeholder Edge voice to be verified by user
    edge_voice: "en-US-GuyNeural"
    edge_rate: "+0%"
    backup_engine: "pyttsx3"

  # Safety & confirmations
  safety:
    confirmation_timeout: 10.0
    privacy_notice: "Audio may be sent to Groq for speech recognition."

# =============================================================================
# Self-written scripts (Milestone 5) — static checks are NOT a full sandbox
# =============================================================================
scripts:
  dir: "scripts"              # inside workspace/
  timeout_seconds: 20
  max_output_chars: 8000
  max_code_chars: 20000
  memory_limit_mb: 256        # Windows Job Object cap (also blocks child processes)
  # none | docker | windows_sandbox. If the chosen sandbox is missing, scripts are refused.
  sandbox: "none"
  docker_image: "python:3.11-slim"

# =============================================================================
# Screen control (Milestone 6) — last resort of the any-task planner
# Disabled automatically on Ollama. vision_provider must name a cloud entry
# in providers: whose model accepts images (set vision_model to override).
# =============================================================================
screen_control:
  enabled: true
  vision_provider: null       # e.g. openrouter (null = screen control disabled)
  vision_model: null          # e.g. a vision-capable model id on that provider
  max_actions: 10
  highlight_ms: 700
  max_image_width: 1280
  max_image_height: 800
  type_interval: 0.02

# =============================================================================
# Browser automation settings (Milestone 4 - Playwright)
# =============================================================================
browser:
  headless: false
  profile_dir: "browser_profile"
  page_timeout_ms: 10000
  action_timeout_ms: 5000
  max_page_text_chars: 4000
  max_tabs: 1



# =============================================================================
# WebSocket server settings (Step 6)
# Live action and avatar feed for desktop frontend (Electron / scripts)
# =============================================================================
server:
  # Enable the background WebSocket server
  enabled: true
  # Must bind to 127.0.0.1 only (local loopback)
  host: "127.0.0.1"
  port: 8765
  # Ephemeral auth token location (stored outside workspace, never committed)
  token_file: ".kira/token"
  # Max simultaneous connected clients
  max_clients: 5
  # Max incoming frame size in bytes (4 KB limit)
  max_message_size: 4096
  # Max incoming messages per second per client
  inbound_rate_limit: 20
  # Outbound loudness events per second
  loudness_rate_limit: 20
  # Allowed origins: "null" and file:// require valid token; web http(s) always rejected
  allowed_origins:
    - "null"
    - "file://"
    - "vscode-webview://"
    - "electron://"

# =============================================================================
# Doctor (python -m backend.doctor)
# =============================================================================
doctor:
  # HTTPS address used for the internet check (HEAD request, no data sent)
  internet_check_url: "https://www.google.com/generate_204"
  # Seconds before each network check gives up
  timeout: 4
  # Command that must be on PATH for the VS Code tools
  code_command: "code"
