<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'self';">
  <title>Kira Avatar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <!-- Speech bubble -->
    <div id="speech-bubble" class="hidden">
      <div id="bubble-text"></div>
    </div>

    <!-- Canvas layer -->
    <canvas id="avatar-canvas" width="480" height="420"></canvas>

    <!-- Character drag area -->
    <div id="drag-handle" title="Drag to move avatar"></div>

    <!-- Control button: appears near the character on hover, opens the avatar menu -->
    <button id="control-btn" title="Kira menu (or right-click the character)" aria-label="Kira menu">⋯</button>

    <!-- Status badges (mic muted / sleeping / offline) -->
    <div id="status-badges" aria-live="polite"></div>

    <!-- Action feed: last few tool events (not clickable, stays click-through) -->
    <ul id="action-feed" aria-label="Action feed"></ul>
  </div>

  <script src="../shared/feed.js"></script>
  <script src="sprite-renderer.js"></script>
  <script src="speech-bubble.js"></script>
  <script src="app.js"></script>
</body>
</html>
